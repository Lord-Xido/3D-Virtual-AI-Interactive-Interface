name: Validate visual engines

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: visual-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate voxel architecture lock
        run: node scripts/validate.mjs

      - name: Validate DM-vOmegaXi numerical contract
        run: node scripts/validate-dm-vomegaxi.mjs
